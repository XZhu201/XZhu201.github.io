<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抗磁性：电子进动产生附加磁矩</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #5d6c7a;
      --line: #d6e3ea;
      --blue: #244fbd;
      --purple: #8d1aa3;
      --red: #d91f3f;
      --orbit: #f04738;
      --panel: rgba(255,255,255,0.9);
      --shadow: 0 16px 38px rgba(17,24,39,0.08);
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(135deg, #ffffff 0%, #eef8fd 58%, #86cdef 100%);
      font-family: "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", Arial, sans-serif;
    }
    button, input { font: inherit; }
    .page {
      width: min(1280px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
    }
    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.1rem);
      line-height: 1.2;
      font-weight: 820;
    }
    .lead {
      margin: 8px 0 0;
      max-width: 920px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.98rem;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }
    .icon-button {
      min-width: 42px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 8px 18px rgba(17,24,39,0.06);
      cursor: pointer;
      font-weight: 780;
      font-size: 1.06rem;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 12px 14px;
    }
    .slider {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .slider label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink);
      font-weight: 800;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }
    .toggle {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }
    .stage {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      min-height: 520px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 520px;
    }
    .panel-head {
      padding: 14px 16px 8px;
      border-bottom: 1px solid rgba(214,227,234,0.72);
    }
    .panel-head h2 {
      margin: 0 0 4px;
      font-size: 1.04rem;
      line-height: 1.35;
    }
    .panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.55;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 430px;
      background: linear-gradient(180deg, rgba(255,255,255,0.84), rgba(235,248,253,0.88));
    }
    .note {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .note p {
      margin: 0;
      color: var(--muted);
      line-height: 1.62;
      font-size: 0.94rem;
    }
    .note strong { color: var(--ink); }
    sub { font-size: 0.72em; vertical-align: -0.25em; }
    @media (max-width: 920px) {
      header, .stage, .note { grid-template-columns: 1fr; }
      .toolbar { justify-content: flex-start; }
      .controls { grid-template-columns: 1fr 1fr; }
      .panel { min-height: 480px; }
    }
    @media (max-width: 620px) {
      .page { padding: 10px; }
      .controls { grid-template-columns: 1fr; }
      .toggle { white-space: normal; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>抗磁性：电子进动产生附加磁矩</h1>
        <p class="lead">外磁场 B<sub>0</sub> 使电子轨道磁矩发生进动。图中给出两种初始取向：虽然 L 和 p<sub>m</sub> 的方向不同，进动平均产生的附加磁矩 Δp<sub>m</sub> 都反向于 B<sub>0</sub>。</p>
      </div>
      <div class="toolbar">
        <button class="icon-button" id="playBtn" title="播放或暂停">⏸</button>
        <button class="icon-button" id="resetBtn" title="重播">↺</button>
      </div>
    </header>

    <section class="controls" aria-label="控制面板">
      <div class="slider">
        <label for="fieldSlider"><span>外磁场强度</span><span id="fieldValue">0.45</span></label>
        <input id="fieldSlider" type="range" min="0" max="100" value="45">
      </div>
      <label class="toggle"><input id="torqueToggle" type="checkbox" checked> 显示 M</label>
      <label class="toggle"><input id="deltaToggle" type="checkbox" checked> 显示 Δp<sub>m</sub></label>
      <label class="toggle"><input id="electronToggle" type="checkbox" checked> 显示电子</label>
    </section>

    <main class="stage">
      <article class="panel">
        <div class="panel-head">
          <h2>情形 A：轨道磁矩有向上分量</h2>
          <p>L 与 p<sub>m</sub> 反向，M 接在 L 端点并给出进动切向（俯视图）。</p>
        </div>
        <canvas id="caseA" width="560" height="430"></canvas>
      </article>

      <article class="panel">
        <div class="panel-head">
          <h2>情形 B：轨道磁矩有向下分量</h2>
          <p>初始取向反过来，进动平均仍得到反向于 B<sub>0</sub> 的 Δp<sub>m</sub>（俯视图）。</p>
        </div>
        <canvas id="caseB" width="560" height="430"></canvas>
      </article>
    </main>

    <section class="note">
      <p><strong>两种初始取向：</strong>上、下两幅图分别表示轨道磁矩初始分量相反的情形。</p>
      <p><strong>力矩方向：</strong>M = p<sub>m</sub> × B<sub>0</sub> = dL/dt，所以红色 M 画在 L 端点的切向。</p>
      <p><strong>抗磁结论：</strong>B<sub>0</sub> 向下时，进动平均产生向上的 Δp<sub>m</sub>。</p>
    </section>
  </div>

  <script>
    const TAU = Math.PI * 2;
    const state = {
      running: true,
      field: 0.45,
      showTorque: true,
      showDelta: true,
      showElectron: true,
      time: 0
    };

    const views = {
      caseA: {
        canvas: document.getElementById("caseA"),
        theta: Math.PI * 0.24,
        phi0: -0.78,
        electronDir: -1,
        title: "A"
      },
      caseB: {
        canvas: document.getElementById("caseB"),
        theta: Math.PI * 0.76,
        phi0: 0.95,
        electronDir: -1,
        title: "B"
      }
    };

    const ui = {
      playBtn: document.getElementById("playBtn"),
      resetBtn: document.getElementById("resetBtn"),
      fieldSlider: document.getElementById("fieldSlider"),
      fieldValue: document.getElementById("fieldValue"),
      torqueToggle: document.getElementById("torqueToggle"),
      deltaToggle: document.getElementById("deltaToggle"),
      electronToggle: document.getElementById("electronToggle")
    };

    function vec(x, y, z) {
      return { x, y, z };
    }

    function add(a, b) {
      return vec(a.x + b.x, a.y + b.y, a.z + b.z);
    }

    function scale(v, s) {
      return vec(v.x * s, v.y * s, v.z * s);
    }

    function cross(a, b) {
      return vec(
        a.y * b.z - a.z * b.y,
        a.z * b.x - a.x * b.z,
        a.x * b.y - a.y * b.x
      );
    }

    function length(v) {
      return Math.hypot(v.x, v.y, v.z);
    }

    function normalize(v) {
      const len = length(v) || 1;
      return scale(v, 1 / len);
    }

    function project(point, center, scaleValue) {
      return {
        x: center.x + scaleValue * (point.x + point.z * 0.42),
        y: center.y - scaleValue * (point.y - point.z * 0.18),
        depth: point.z
      };
    }

    function buildBasis(normal) {
      const helper = Math.abs(normal.y) < 0.92 ? vec(0, 1, 0) : vec(1, 0, 0);
      const u = normalize(cross(normal, helper));
      const v = normalize(cross(normal, u));
      return { u, v };
    }

    function getNormal(theta, phi) {
      return normalize(vec(
        Math.sin(theta) * Math.cos(phi),
        Math.cos(theta),
        Math.sin(theta) * Math.sin(phi)
      ));
    }

    function projectPrecessionPoint(theta, phi, radius, center, scaleValue, flatten = -0.25) {
      const rawTip = project(scale(getNormal(theta, phi), -radius), center, scaleValue);
      const ringCenter = project(vec(0, radius * -Math.cos(theta), 0), center, scaleValue);
      return {
        x: rawTip.x,
        y: ringCenter.y + (rawTip.y - ringCenter.y) * flatten
      };
    }

    function arrow(ctx, start, end, color, width, head = 12) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const angle = Math.atan2(dy, dx);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(end.x, end.y);
      ctx.lineTo(end.x - head * Math.cos(angle - Math.PI / 7), end.y - head * Math.sin(angle - Math.PI / 7));
      ctx.lineTo(end.x - head * Math.cos(angle + Math.PI / 7), end.y - head * Math.sin(angle + Math.PI / 7));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function label(ctx, text, x, y, options = {}) {
      ctx.save();
      ctx.fillStyle = options.color || "#17202a";
      ctx.font = options.font || "700 15px Microsoft YaHei, sans-serif";
      ctx.textAlign = options.align || "left";
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function resizeCanvases() {
      Object.values(views).forEach((view) => {
        const rect = view.canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        view.canvas.width = Math.max(520, Math.floor(rect.width * dpr));
        view.canvas.height = Math.max(390, Math.floor(rect.height * dpr));
        const ctx = view.canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      });
    }

    function drawField(ctx, center, scaleValue, strength) {
      const axisLen = 0.92 + strength * 0.36;
      const start = project(vec(0, axisLen * 0.56, 0), center, scaleValue);
      const end = project(vec(0, -axisLen, 0), center, scaleValue);
      if (strength < 0.01) {
        ctx.save();
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = "rgba(36,79,189,0.3)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
        ctx.restore();
        label(ctx, "B₀ = 0", end.x + 10, end.y + 6, { color: "#244fbd" });
        return;
      }
      arrow(ctx, start, end, "#244fbd", 5, 15);
      label(ctx, "B₀", end.x + 12, end.y + 8, { color: "#244fbd", font: "800 18px Microsoft YaHei, sans-serif" });
    }

    function drawOrbitScene(view, offset) {
      const ctx = view.canvas.getContext("2d");
      const rect = view.canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      ctx.clearRect(0, 0, w, h);

      const center = { x: w * 0.46, y: h * 0.58 };
      const scaleValue = Math.min(w, h) * 0.31;
      const orbitRadius = 1.08;
      const omega = state.field < 0.01 ? 0 : 0.28 + state.field * 1.25;
      const phi = view.phi0 - omega * (state.time + offset);
      const normal = getNormal(view.theta, phi);
      const basis = buildBasis(normal);

      label(ctx, state.field < 0.01 ? "B₀ = 0：无外场进动" : "轨道法线绕 B₀ 进动", 18, 28, {
        color: state.field < 0.01 ? "#5b6877" : "#244fbd",
        font: "800 16px Microsoft YaHei, sans-serif"
      });

      drawField(ctx, center, scaleValue, state.field);

      if (state.field > 0.01) {
        ctx.save();
        ctx.beginPath();
        for (let i = 0; i <= 100; i++) {
          const samplePhi = phi + i * 0.06;
          const p = projectPrecessionPoint(view.theta, samplePhi, 1.18, center, scaleValue, -0.25);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = "rgba(0,0,0,0.62)";
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 6]);
        ctx.stroke();
        ctx.restore();
      }

      const orbitPoints = [];
      for (let i = 0; i <= 160; i++) {
        const angle = (i / 160) * TAU;
        const point3d = add(scale(basis.u, orbitRadius * Math.cos(angle)), scale(basis.v, orbitRadius * Math.sin(angle)));
        orbitPoints.push(project(point3d, center, scaleValue));
      }

      ctx.save();
      ctx.beginPath();
      orbitPoints.forEach((point, index) => {
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.closePath();
      ctx.fillStyle = "rgba(240,72,53,0.10)";
      ctx.fill();
      ctx.strokeStyle = "#f04738";
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();

      const lTip = projectPrecessionPoint(view.theta, phi, 1.05, center, scaleValue, 0.2);
      const pmTip = {
        x: center.x - (lTip.x - center.x) * (1.15 / 1.05),
        y: center.y - (lTip.y - center.y) * (1.15 / 1.05)
      };
      arrow(ctx, center, lTip, "#111827", 4, 14);
      label(ctx, "L", lTip.x + 10, lTip.y + 4, { font: "800 19px Microsoft YaHei, sans-serif" });
      arrow(ctx, center, pmTip, "#111827", 4, 14);
      label(ctx, "pₘ", pmTip.x + 10, pmTip.y + 4, { font: "800 19px Microsoft YaHei, sans-serif" });

      if (state.showTorque && state.field > 0.01) {
        const mStart = projectPrecessionPoint(view.theta, phi + 0.26, 1.24, center, scaleValue, -0.25);
        const mEnd = projectPrecessionPoint(view.theta, phi - 0.10 - state.field * 0.04, 1.24, center, scaleValue, -0.25);
        arrow(ctx, mStart, mEnd, "#d91f3f", 5, 13);
        const mdx = mEnd.x - mStart.x;
        const mdy = mEnd.y - mStart.y;
        const mLen = Math.hypot(mdx, mdy) || 1;
        const labelOffset = {
          x: 16 * mdx / mLen - 10 * mdy / mLen,
          y: 16 * mdy / mLen + 10 * mdx / mLen
        };
        label(ctx, "M", mEnd.x + labelOffset.x, mEnd.y + labelOffset.y, {
          color: "#d91f3f",
          font: "800 18px Microsoft YaHei, sans-serif"
        });
      }

      if (state.showDelta) {
        if (state.field > 0.01) {
          const start = project(vec(-1.46, -0.98, 0), center, scaleValue);
          const end = project(vec(-1.46, -0.98 + 0.62 + state.field * 0.72, 0), center, scaleValue);
          arrow(ctx, start, end, "#8d1aa3", 7, 18);
          label(ctx, "Δpₘ", end.x + 12, end.y + 4, {
            color: "#8d1aa3",
            font: "800 20px Microsoft YaHei, sans-serif"
          });
        } else {
          label(ctx, "Δpₘ = 0", 24, h - 24, {
            color: "#8d1aa3",
            font: "800 18px Microsoft YaHei, sans-serif"
          });
        }
      }

      if (state.showElectron) {
        const electronAngle = (state.time + offset) * 4.6 * view.electronDir;
        const electron3d = add(
          scale(basis.u, orbitRadius * Math.cos(electronAngle)),
          scale(basis.v, orbitRadius * Math.sin(electronAngle))
        );
        const electron = project(electron3d, center, scaleValue);
        ctx.save();
        ctx.beginPath();
        ctx.arc(center.x, center.y, 12, 0, TAU);
        ctx.fillStyle = "#ff6655";
        ctx.fill();
        ctx.strokeStyle = "#ad1b28";
        ctx.lineWidth = 2;
        ctx.stroke();
        label(ctx, "+", center.x, center.y + 5, { align: "center", font: "800 18px Arial" });
        ctx.beginPath();
        ctx.arc(electron.x, electron.y, 7.5, 0, TAU);
        ctx.fillStyle = "#345bd5";
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
        label(ctx, "-", electron.x, electron.y + 4, { align: "center", color: "#fff", font: "800 13px Arial" });
        ctx.restore();
      }
    }

    function render() {
      drawOrbitScene(views.caseA, 0);
      drawOrbitScene(views.caseB, 0.55);
    }

    function updateUi() {
      ui.playBtn.textContent = state.running ? "⏸" : "▶";
      ui.fieldValue.textContent = state.field.toFixed(2);
    }

    function tick() {
      if (state.running) state.time += 0.016;
      render();
      requestAnimationFrame(tick);
    }

    ui.playBtn.addEventListener("click", () => {
      state.running = !state.running;
      updateUi();
    });

    ui.resetBtn.addEventListener("click", () => {
      state.running = true;
      state.time = 0;
      updateUi();
    });

    ui.fieldSlider.addEventListener("input", () => {
      state.field = Number(ui.fieldSlider.value) / 100;
      updateUi();
    });

    ui.torqueToggle.addEventListener("change", () => {
      state.showTorque = ui.torqueToggle.checked;
      render();
    });

    ui.deltaToggle.addEventListener("change", () => {
      state.showDelta = ui.deltaToggle.checked;
      render();
    });

    ui.electronToggle.addEventListener("change", () => {
      state.showElectron = ui.electronToggle.checked;
      render();
    });

    window.addEventListener("resize", () => {
      resizeCanvases();
      render();
    });

    resizeCanvases();
    updateUi();
    tick();
  </script>
</body>
</html>
